name: MAGI Integrity Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Source validation
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install validation dependencies
        run: sudo apt-get update && sudo apt-get install --yes jq lua5.4

      - name: Run MAGI integrity checks
        env:
          EVANGELION_SOURCE_ONLY: "1"
        run: ./validate.sh

      - name: Test transactional installer
        run: ./tests/installer.sh
